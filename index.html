<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>House Designer Spike</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <script>window.__t0 = performance.now()</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&display=swap" />
    <style>
      /* Layout: full-screen 3D view; one floating control card top-left, one status strip bottom-left. */
      :root {
        --bg: #dfe2e4; --panel: #ffffffeb; --ink: #1d2327; --muted: #5a646c; --line: #b9c0c6;
        --accent: #2d5e8c; --accent-ink: #ffffff; --warn: #b4411b;
        --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-data: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        --gutter-l: max(16px, env(safe-area-inset-left, 0px));
        --gutter-r: max(16px, env(safe-area-inset-right, 0px));
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c2126; --panel: #262c33eb; --ink: #e7ebee; --muted: #a4aeb7; --line: #46505a;
          --accent: #7fb0dd; --accent-ink: #0f1a24; --warn: #f08a5d; color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c2126; --panel: #262c33eb; --ink: #e7ebee; --muted: #a4aeb7; --line: #46505a;
        --accent: #7fb0dd; --accent-ink: #0f1a24; --warn: #f08a5d; color-scheme: dark;
      }
      html, body, #root { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font-ui); }
      #root { position: relative; overflow: hidden; }
      .card {
        position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: var(--gutter-l);
        width: min(360px, calc(100% - var(--gutter-l) - var(--gutter-r))); box-sizing: border-box;
        display: grid; gap: 8px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; box-shadow: 0 2px 10px #0000001f;
      }
      .eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
      .size { font: 600 24px/1.1 var(--font-data); font-variant-numeric: tabular-nums; }
      .facts { font-size: 13px; color: var(--muted); }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      .btn {
        font: 600 15px/1 var(--font-ui); min-height: 44px; padding: 0 14px; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
      }
      .btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
      .btn:disabled { opacity: .5; cursor: default; }
      .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      .error { color: var(--warn); font-size: 13px; }
      .readout {
        position: absolute; left: var(--gutter-l); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        max-width: calc(100% - var(--gutter-l) - var(--gutter-r)); box-sizing: border-box;
        padding: 6px 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line);
        font: 12px/1.4 var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
